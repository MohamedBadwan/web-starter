name: Check rules

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync:
    name: Template rules are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/sync-rules.mjs --check
